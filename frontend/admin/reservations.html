<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>방문 예약 관리 | Ha-yeon Jeon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="reservations.css">
</head>
<body class="admin-body">

  <nav class="admin-nav">
    <span class="nav-word">Ha-yeon Jeon <em>Admin</em></span>
    <div class="admin-nav-actions">
      <a href="./" class="admin-ghost-btn"><i class="fa-solid fa-folder-open"></i> 프로젝트 관리</a>
      <button id="logout-btn" class="admin-ghost-btn" hidden><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
    </div>
  </nav>

  <!-- shown when there is no admin session -->
  <section id="auth-view" class="admin-panel rsv-auth" hidden>
    <span class="kicker">Reservations</span>
    <h2>관리자 로그인이 필요합니다</h2>
    <p>방문 예약 목록은 관리자만 볼 수 있습니다.</p>
    <a href="./" class="pbtn-fill rsv-login-link">로그인하러 가기</a>
  </section>

  <section id="rsv-view" class="admin-panel rsv-panel" hidden>
    <div class="admin-panel-head">
      <div>
        <span class="kicker">Reservations</span>
        <h2>방문 예약 신청 목록</h2>
      </div>
      <button id="refresh-btn" class="admin-ghost-btn"><i class="fa-solid fa-rotate"></i> 새로고침</button>
    </div>

    <p class="rsv-summary" id="rsv-summary" aria-live="polite"></p>

    <div class="rsv-filters" role="group" aria-label="처리 상태 필터">
      <button type="button" class="rsv-filter active" aria-pressed="true" data-status="all">전체 <b id="count-all">0</b></button>
      <button type="button" class="rsv-filter" aria-pressed="false" data-status="pending">접수 <b id="count-pending">0</b></button>
      <button type="button" class="rsv-filter" aria-pressed="false" data-status="confirmed">확정 <b id="count-confirmed">0</b></button>
      <button type="button" class="rsv-filter" aria-pressed="false" data-status="cancelled">취소 <b id="count-cancelled">0</b></button>
    </div>

    <p class="rsv-showing" id="rsv-showing"></p>

    <div class="rsv-table-wrap">
      <table class="rsv-table">
        <thead>
          <tr>
            <th scope="col">방문 일시</th>
            <th scope="col">이름</th>
            <th scope="col">이메일</th>
            <th scope="col">방문 목적</th>
            <th scope="col">접수 시각</th>
            <th scope="col">처리 상태</th>
          </tr>
        </thead>
        <tbody id="rsv-body">
          <tr><td colspan="6" class="rsv-empty">불러오는 중…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <div class="wtoast" id="rsv-toast"></div>

  <script src="reservations.js"></script>
</body>
</html>
