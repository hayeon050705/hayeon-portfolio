<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>프로젝트 관리 | Ha-yeon Jeon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

  <!-- ============================= LOGIN VIEW ============================= -->
  <section id="login-view" class="admin-login-view">
    <div class="admin-login-card">
      <span class="kicker">Ha-yeon Jeon</span>
      <h1>프로젝트 관리자</h1>
      <p class="admin-login-desc">비밀번호를 입력하면 프로젝트를 추가·수정할 수 있습니다.</p>
      <form id="login-form" class="admin-login-form">
        <input type="password" id="login-password" placeholder="비밀번호" autocomplete="current-password" required>
        <button type="submit" class="pbtn-fill">로그인</button>
      </form>
      <p class="admin-error" id="login-error" hidden></p>
    </div>
  </section>

  <!-- ============================= DASHBOARD VIEW ============================= -->
  <section id="dashboard-view" class="admin-dashboard-view" hidden>

    <nav class="admin-nav">
      <span class="nav-word">Ha-yeon Jeon <em>Admin</em></span>
      <div class="admin-nav-actions">
        <a href="../index.html" target="_blank" rel="noopener" class="admin-ghost-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> 사이트 보기</a>
        <button id="logout-btn" class="admin-ghost-btn"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</button>
      </div>
    </nav>

    <!-- ---- List panel ---- -->
    <div id="list-panel" class="admin-panel">
      <div class="admin-panel-head">
        <div>
          <span class="kicker">Projects</span>
          <h2>프로젝트 목록</h2>
        </div>
        <button id="new-project-btn" class="pbtn-fill"><i class="fa-solid fa-plus"></i> 새 프로젝트</button>
      </div>

      <div id="project-list" class="admin-project-list">
        <p class="admin-empty" id="list-loading">불러오는 중…</p>
      </div>
    </div>

    <!-- ---- Editor panel ---- -->
    <div id="editor-panel" class="admin-panel" hidden>
      <div class="admin-panel-head">
        <div>
          <span class="kicker" id="editor-kicker">New</span>
          <h2 id="editor-title">새 프로젝트</h2>
        </div>
        <button id="back-to-list-btn" class="admin-ghost-btn"><i class="fa-solid fa-arrow-left"></i> 목록으로</button>
      </div>

      <form id="project-form" class="admin-form">
        <div class="admin-field">
          <label for="f-title">제목 <span class="req">*</span></label>
          <input type="text" id="f-title" placeholder="예: 도심 유휴부지 커뮤니티 정원 조성 프로젝트">
        </div>

        <div class="admin-field">
          <label for="f-role">내가 한 역할 <span class="req">*</span></label>
          <input type="text" id="f-role" placeholder="예: 공간 데이터 분석 및 식재 계획 담당">
        </div>

        <div class="admin-field">
          <label for="f-description">설명 <span class="req">*</span></label>
          <textarea id="f-description" rows="4" placeholder="예: GIS 데이터를 활용해 유휴부지의 일조량·토양 조건을 분석하고, 지역 주민 참여형 커뮤니티 정원을 설계했습니다."></textarea>
        </div>

        <div class="admin-field-row">
          <div class="admin-field">
            <label for="f-date">날짜 <span class="req">*</span></label>
            <input type="text" id="f-date" placeholder="예: 2026.03 – 2026.06">
          </div>
          <div class="admin-field">
            <label for="f-teamSize">참여인원수 <span class="req">*</span></label>
            <input type="text" id="f-teamSize" placeholder="예: 4명">
          </div>
        </div>

        <div class="admin-field">
          <label for="f-notes">참고사항 <span class="admin-optional">(선택)</span></label>
          <textarea id="f-notes" rows="3" placeholder="예: 교내 캡스톤디자인 경진대회 출품작"></textarea>
        </div>

        <div class="admin-field">
          <label>공개 상태</label>
          <div class="admin-status-toggle">
            <button type="button" class="status-opt active" data-status="draft" id="status-draft-btn">
              <i class="fa-regular fa-file-lines"></i> 초안
              <small>모든 항목을 채우지 않아도 저장 가능. 관리자 화면에만 표시됩니다.</small>
            </button>
            <button type="button" class="status-opt" data-status="published" id="status-published-btn">
              <i class="fa-solid fa-globe"></i> 공개
              <small>참고사항을 제외한 모든 항목이 입력되어야 합니다. 사이트에 공개됩니다.</small>
            </button>
          </div>
        </div>

        <p class="admin-error" id="form-error" hidden></p>

        <div class="admin-form-actions">
          <button type="submit" class="pbtn-fill" id="save-btn"><i class="fa-solid fa-check"></i> 저장</button>
        </div>
      </form>
    </div>

  </section>

  <div class="wtoast" id="admin-toast"></div>

  <script src="admin.js"></script>
</body>
</html>
